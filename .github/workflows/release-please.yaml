on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when release token is not configured
        if: ${{ secrets.RELEASE_PLEASE_TOKEN == '' }}
        run: echo "::warning::RELEASE_PLEASE_TOKEN is not configured. Skipping release-please to avoid failing when GitHub Actions PR creation is restricted."
      - uses: googleapis/release-please-action@v4
        if: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # this is a built-in strategy in release-please, see "Action Inputs"
          # for more options
          release-type: simple
